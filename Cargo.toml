[package]
name = "axon"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/axon"
homepage = "https://github.com/savageAZfck/axon"
license = "MIT"
description = "Audited reflex arc for autonomous agents: hard-bounded, sub-deliberative triggers that can brake, alert, or quarantine — but can never steer — every firing on its own hash-chained log"
keywords = ["reflex", "safety", "watchdog", "sovereignty", "agents"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[features]
default = []
